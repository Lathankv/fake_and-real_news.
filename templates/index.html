<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake News Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #091d2b; --panel: #1b2d3f; --ink: #edf3f8; --muted: #a8b4c3;
    --line: rgba(255,255,255,0.08); --real: #5ec7af; --fake: #f3889a;
    --serif: "Newsreader", Georgia, serif;
    --sans: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 600 16px/1.5 var(--sans); }
  main { max-width: 1080px; margin: 0 auto; padding: 52px 24px 64px; }
  h1 { font: 800 clamp(3rem, 6vw, 5rem)/1.05 var(--serif); letter-spacing: -0.06em; margin: 0 0 18px; }
  .lede { color: var(--muted); margin: 0 0 28px; max-width: 56ch; font-size: clamp(1.2rem, 2vw, 2rem); line-height: 1.3; font-weight: 600; }
  textarea {
    width: 100%; min-height: 220px; padding: 18px 18px 14px; resize: vertical;
    background: rgba(255,255,255,0.04); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; font: inherit;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  button {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 6px;
    padding: 12px 20px; font: 600 1rem var(--sans); cursor: pointer;
  }
  button.ghost { background: none; color: var(--muted); padding: 12px 4px; }
  button:disabled { opacity: .5; cursor: wait; }
  #count { margin-left: auto; color: var(--muted); font-size: .875rem; }

  #result { margin-top: 32px; display: none; }
  #verdict { font: 700 2rem/1.1 var(--serif); margin: 0 0 16px; }
  .meter { position: relative; height: 14px; border-radius: 7px;
    background: linear-gradient(90deg, var(--fake), var(--line) 50%, var(--real)); }
  .marker { position: absolute; top: -6px; width: 4px; height: 26px; background: var(--ink);
    border-radius: 2px; left: 50%; transition: left .5s ease; }
  .ends { display: flex; justify-content: space-between; color: var(--muted);
    font-size: .875rem; margin-top: 8px; }
  #detail { margin: 16px 0 0; }
  .note { color: var(--muted); font-size: .875rem; margin-top: 32px; max-width: 56ch; }
  #error { color: var(--fake); margin-top: 12px; min-height: 1.5em; }
  @media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Fake and real news</h1>
  <p class="lede">Paste the headline and text of a news article and check it.</p>

  <label for="text" class="lede" style="display:block;margin:0 0 12px;font-size: 1.02rem;">Article text</label>
  <textarea id="text" placeholder="Paste the headline and article here"></textarea>
  <div class="row">
    <button id="check">Check article</button>
    <button id="clear" class="ghost" type="button">Clear</button>
    <span id="count">0 words</span>
  </div>
  <div id="error" role="alert"></div>

  <section id="result" aria-live="polite">
    <p id="verdict"></p>
    <div class="meter"><div class="marker" id="marker"></div></div>
    <div class="ends"><span>Fake</span><span>Real</span></div>
    <p id="detail"></p>
  </section>

  <p class="note">This tool judges writing style, not facts. A high score does not prove a story is true. Check the source before you share.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const words = (s) => s.trim().split(/\s+/).filter(Boolean).length;

  $("text").addEventListener("input", () => {
    $("count").textContent = words($("text").value) + " words";
  });

  $("clear").addEventListener("click", () => {
    $("text").value = ""; $("count").textContent = "0 words";
    $("result").style.display = "none"; $("error").textContent = "";
  });

  $("check").addEventListener("click", async () => {
    $("error").textContent = "";
    $("check").disabled = true; $("check").textContent = "Checking…";
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: $("text").value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      const real = data.real_percent;
      $("result").style.display = "block";
      $("verdict").textContent = data.label;
      $("verdict").style.color = real >= 50 ? "var(--real)" : "var(--fake)";
      $("marker").style.left = `calc(${real}% - 2px)`;
      $("detail").textContent = `${real}% real, ${(100 - real).toFixed(1)}% fake.`;
    } catch (e) {
      $("error").textContent = e.message;
    } finally {
      $("check").disabled = false; $("check").textContent = "Check article";
    }
  });
</script>
</body>
</html>
